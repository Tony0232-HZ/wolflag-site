# WOLFLAG 网站管理后台配置（Decap CMS）
# 部署到 GitHub + Cloudflare Pages 后需改两个地方：
#   1. repo:     改成你的 GitHub 仓库，如 "yourname/wolflag-site"
#   2. base_url: 改成 OAuth 代理地址，如 "https://decap-proxy.你的名字.workers.dev"
# 详细步骤见仓库根目录 README.md

backend:
  name: github
  repo: Tony0232-HZ/wolflag-site
  branch: main
  base_url: https://decap.tony222.workers.dev

media_folder: "media"                 # 上传图片保存位置（站内图片库）
public_folder: "/assets/media"        # 网站上图片 URL 前缀
logo_url: "/assets/media/favicon.png"
site_url: https://www.wolflag.com

collections:
  # ---------- 站点设置：导航 / 页脚 / 联系方式 ----------
  - name: settings
    label: 站点设置
    files:
      - name: site
        label: 导航 / 页脚 / 联系方式
        file: content/settings.json
        fields:
          - { label: 品牌名, name: brand, widget: string }
          - { label: Logo, name: logo, widget: image }
          - label: 导航菜单
            name: nav
            widget: list
            summary: "{{fields.label}} → {{fields.url}}"
            fields:
              - { label: 菜单文字, name: label, widget: string }
              - { label: 链接, name: url, widget: string }
              - { label: 外链(新窗口打开), name: external, widget: boolean, default: false }
              - label: 子菜单（可留空；添加后菜单项显示下拉列表）
                name: children
                widget: list
                required: false
                summary: "{{fields.label}} → {{fields.url}}"
                fields:
                  - { label: 子菜单文字, name: label, widget: string }
                  - { label: 链接, name: url, widget: string }
                  - { label: 外链(新窗口打开), name: external, widget: boolean, default: false }
          - label: 联系按钮
            name: contactButton
            widget: object
            fields:
              - { label: 按钮文字, name: text, widget: string }
              - { label: 按钮链接, name: url, widget: string }
          - label: 产品手册下载按钮
            name: catalogButton
            widget: object
            fields:
              - { label: 按钮文字, name: text, widget: string }
              - label: 产品手册文件 (PDF)
                name: file
                widget: file
                hint: 上传或更换产品手册 PDF 文件
          - { label: 博客页标题（列表页顶部）, name: blogTitle, widget: string, default: Blog, required: false, hint: 博客列表页顶部的大标题，默认 "Blog" }
          - label: 页脚
            name: footer
            widget: object
            fields:
              - label: 地址区块
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: 标题, name: heading, widget: string }
                  - label: 地址行
                    name: lines
                    widget: list
                    field: { label: 行, name: line, widget: string }
              - label: 电话
                name: phones
                widget: list
                field: { label: 电话, name: phone, widget: string }
              - label: 邮箱列表
                name: emails
                widget: list
                field: { label: 邮箱, name: email, widget: string }
              - { label: 页脚 Logo, name: logo, widget: image, required: false }
              - label: 社交图标
                name: icons
                widget: list
                summary: "{{fields.url}}"
                fields:
                  - { label: 图标图片, name: icon, widget: image }
                  - { label: 链接地址, name: url, widget: string, required: false, hint: 粘贴社交平台链接，如 https://www.facebook.com/xxx；留空则点击发邮件 }
              - { label: 版权行, name: copyright, widget: string }

  # ---------- 首页 ----------
  - name: home
    label: 首页
    files:
      - name: page
        label: 首页内容
        file: content/home.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - label: 首屏 (Hero)
            name: hero
            widget: object
            fields:
              - { label: 大标题, name: title, widget: string }
              - { label: 副文案, name: text, widget: text }
              - { label: 横幅图片, name: image, widget: image }
              - label: 特性标签
                name: features
                widget: list
                field: { label: 标签, name: tag, widget: string }
          - label: 简介区块
            name: intro
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 文案, name: text, widget: text }
              - label: 照片
                name: images
                widget: list
                field: { label: 图片, name: image, widget: image }
          - label: 主要产品
            name: categories
            widget: object
            fields:
              - { label: 区块标题, name: title, widget: string }
              - { label: 导语, name: intro, widget: text }
              - label: 产品卡片
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: 卡片标题, name: title, widget: string }
                  - { label: 卡片文案, name: text, widget: text }
                  - { label: 图片, name: image, widget: image }
                  - { label: 跳转链接, name: link, widget: string }

  # ---------- 关于我们 ----------
  - name: about
    label: 关于我们
    files:
      - name: page
        label: 关于我们内容
        file: content/about.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - label: 页头
            name: hero
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 副标题, name: subtitle, widget: string }
              - { label: 页头图片, name: image, widget: image }
          - label: 介绍段落
            name: paragraphs
            widget: list
            field: { label: 段落, name: text, widget: text }
          - { label: 工厂图片, name: factoryImage, widget: image }
          - { label: 工厂下方补充图片, name: collageImage, widget: image, required: false, hint: 显示在工厂图片下方（可选，不填则不显示） }
          - label: 客户
            name: clients
            widget: object
            fields:
              - { label: 区块标题, name: title, widget: string }
              - { label: 大标题, name: tagline, widget: string }
              - { label: 副文案, name: subtitle, widget: string }
              - label: 客户 Logo
                name: logos
                widget: list
                field: { label: Logo, name: logo, widget: image }
          - label: 常见问题 (FAQ)
            name: faq
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: 问题, name: q, widget: string }
              - { label: 答案, name: a, widget: text }

  # ---------- 新增类目页（通用模板） ----------
  - name: pages
    label: 新增类目页
    folder: content/pages
    create: true
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.heading}}"
    identifier_field: slug
    fields:
      - { label: 文件标识（英文小写，如 led-display）, name: slug, widget: string, hint: 用于内容文件与网址命名 }
      - label: 页面声明
        name: page
        widget: object
        fields:
          - { label: 页面文件名（含 .html）, name: file, widget: string, hint: 如 led-display.html }
          - label: 排版模板
            name: layout
            widget: select
            options: [simple, flags, feather, bannerCards, pole, detail, flex]
            default: simple
            hint: simple=通用网格；flags=国旗式；feather=横卡式；bannerCards=横幅式；pole=旗杆展架式；detail=产品详情（多图+规格+价格表）；flex=通用图文（标题+文字+图片组合）
          - { label: 导航地址，如 /led-display.html, name: nav, widget: string }
      - label: SEO
        name: seo
        widget: object
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面描述, name: description, widget: text }
      - { label: 页面主标题, name: heading, widget: string }
      - { label: 标语（可选）, name: tagline, widget: string, required: false }
      - { label: 顶部横幅图片, name: bannerImage, widget: image, required: false, hint: 页面顶部的大横幅（可选，不填则无横幅） }
      - label: 产品列表（通用/国旗/横幅/羽毛旗/旗杆等模板用）
        name: products
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { label: 名称, name: name, widget: string }
          - { label: 跳转链接（可选，填了图片和标题就可点击）, name: link, widget: string, required: false, hint: 如 /banner.html }
          - { label: 尺寸（可选）, name: size, widget: string, required: false }
          - { label: 材质（可选）, name: material, widget: string, required: false }
          - { label: 描述, name: desc, widget: text, required: false }
          - { label: 图片, name: image, widget: image }
      - label: 图文区块（flex 通用图文模板用，可按顺序多组）
        name: sections
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: 小标题, name: title, widget: string, required: false }
          - { label: 文字, name: text, widget: text, required: false }
          - label: 图片（可多张）
            name: images
            widget: list
            required: false
            field: { label: 图片, name: image, widget: image }

  # ---------- 产品：羽毛旗 ----------
  - name: feather-flags
    label: 羽毛旗产品页
    files:
      - name: page
        label: Feather flag
        file: content/products/feather-flags.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - { label: 页面标题, name: heading, widget: string }
          - { label: 徽标文案, name: badge, widget: string }
          - { label: 顶部横幅图片, name: bannerImage, widget: image, required: false, hint: 页面顶部的大横幅（可选，不填则无横幅） }
          - label: 产品
            name: products
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 尺寸, name: size, widget: string }
              - { label: 材质/工艺, name: material, widget: string }
              - { label: 描述, name: desc, widget: text }
              - { label: 图片, name: image, widget: image }
          - { label: 底部引导语, name: cta, widget: string }

  # ---------- 产品：横幅 ----------
  - name: banners
    label: 横幅产品页
    files:
      - name: page
        label: Banner
        file: content/products/banners.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - { label: 页面标题, name: heading, widget: string }
          - { label: 标语, name: tagline, widget: string }
          - { label: 顶部横幅图片, name: bannerImage, widget: image, required: false, hint: 页面顶部的大横幅（可选，不填则无横幅） }
          - label: 产品
            name: products
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 描述, name: desc, widget: string }
              - { label: 材质, name: material, widget: string }
              - { label: 细节说明, name: detail, widget: text }
              - { label: 图片, name: image, widget: image }

  # ---------- 产品：国旗 ----------
  - name: national-flags
    label: 国旗产品页
    files:
      - name: page
        label: National Flag
        file: content/products/national-flags.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - { label: 页面标题, name: heading, widget: string }
          - { label: 标语, name: tagline, widget: string }
          - { label: 顶部横幅图片, name: bannerImage, widget: image, required: false, hint: 页面顶部的大横幅（可选，不填则无横幅） }
          - label: 产品
            name: products
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 尺寸, name: size, widget: string }
              - { label: 材质, name: material, widget: string }
              - { label: 印刷工艺, name: printing, widget: string }
              - { label: 图片, name: image, widget: image }

  # ---------- 产品详情页（多图 + 规格 + 价格表 + 服务卡 + 图文区） ----------
  - name: product-details
    label: 产品详情页
    folder: content/product-details
    create: true
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.heading}}"
    identifier_field: slug
    fields:
      - { label: 文件标识（英文小写，如 car-flags）, name: slug, widget: string, hint: 用于网址命名，发布后不建议再改 }
      - label: 页面声明
        name: page
        widget: object
        fields:
          - { label: 页面文件名（含 .html）, name: file, widget: string, hint: 如 car-flags.html }
          - { label: 导航地址，如 /car-flags.html, name: nav, widget: string }
      - label: SEO
        name: seo
        widget: object
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面描述, name: description, widget: text }
      - { label: 页面主标题, name: heading, widget: string }
      - { label: 标语（可选）, name: tagline, widget: string, required: false }
      - label: 产品（一个页面可放多个，每个产品独立图库+信息栏）
        name: products
        widget: list
        summary: "{{fields.name}}"
        fields:
          - { label: 品名, name: name, widget: string }
          - { label: 描述（可选）, name: desc, widget: text, required: false }
          - label: 产品图片（多张，第一张为主图）
            name: images
            widget: list
            required: false
            field: { label: 图片, name: image, widget: image }
          - { label: 面料材质 Fabric, name: fabric, widget: string, required: false }
          - { label: 印刷方式 Printing, name: printing, widget: string, required: false }
          - { label: 尺寸 Size, name: size, widget: string, required: false }
          - label: 价格表（按数量分成多行）
            name: prices
            widget: list
            required: false
            summary: "{{fields.qty}} → {{fields.price}}"
            fields:
              - { label: 数量（如 100 pcs）, name: qty, widget: string }
              - { label: 价格（如 $0.85）, name: price, widget: string }
          - { label: 最小起订量 MOQ, name: moq, widget: string, required: false }
          - { label: 交期 Lead Time, name: leadTime, widget: string, required: false }
      - label: 服务小卡片（默认 3 张，可增删改；图标可上传更换）
        name: serviceCards
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: 小图标（上传图）, name: icon, widget: image, required: false }
          - { label: 卡标题, name: title, widget: string }
          - { label: 卡文字, name: text, widget: text }
      - label: 图文区（三张卡下方的标题+文字+图片）
        name: textImg
        widget: object
        required: false
        fields:
          - { label: 大标题, name: title, widget: string, required: false }
          - { label: 文字, name: text, widget: text, required: false }
          - label: 图片（可多张）
            name: images
            widget: list
            required: false
            field: { label: 图片, name: image, widget: image }

  # ---------- 产品：旗杆展架 ----------
  - name: pole-display
    label: 旗杆展架产品页
    files:
      - name: page
        label: Pole & Display
        file: content/products/pole-display.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - { label: 页面标题, name: heading, widget: string }
          - { label: 副标题, name: subheading, widget: string }
          - { label: 副标题说明, name: subtext, widget: text }
          - label: 主打产品 (大型卡)
            name: featured
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 描述, name: desc, widget: text }
              - { label: 补充说明, name: detail, widget: string }
              - { label: 强调标签, name: tag, widget: string }
              - { label: 图片, name: image, widget: image }
          - label: 配件专栏
            name: ingredients
            widget: object
            fields:
              - { label: 专栏标题, name: title, widget: string }
              - { label: 副标题, name: subtitle, widget: string }
              - label: 配件
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: 描述, name: desc, widget: text }
                  - { label: 图片, name: image, widget: image }

  # ---------- 博客文章（新闻/产品/公告/公司大事） ----------
  - name: blog
    label: 博客文章
    folder: content/blog
    create: true
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.title}}"
    identifier_field: slug
    fields:
      - { label: 文件标识（英文小写，如 our-new-product）, name: slug, widget: string, hint: 用于网址命名，发布后不建议再改 }
      - { label: 文章标题, name: title, widget: string }
      - label: 发布日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        hint: 列表按日期排列（新的在前）
      - { label: 置顶（勾选后排在最前）, name: pinned, widget: boolean, default: false, required: false, hint: 勾选置顶后排在列表最前；多个置顶按时间排；取消勾选回到时间顺序 }
      - { label: 草稿（勾选则不上线）, name: draft, widget: boolean, default: false, required: false }
      - { label: 封面图片, name: coverImage, widget: image, required: false }
      - { label: 摘要（列表页显示）, name: summary, widget: text, required: false }
      - label: 正文内容
        name: blocks
        widget: list
        summary: "{{fields.type}}"
        fields:
          - { label: 类型, name: type, widget: select, options: [p, h2, image], default: p, hint: p=普通段落，h2=小标题，image=插图（任意位置、数量不限） }
          - { label: 文本（段落/小标题内容；图片类型时为描述文字）, name: text, widget: text, required: false }
          - { label: 图片（类型选 image 时上传）, name: image, widget: image, required: false }
