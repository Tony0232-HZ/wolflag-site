          - { label: 页面文件名（含 .html）, name: file, widget: string, hint: 如 car-flags.html }
          - { label: 导航地址，如 /car-flags.html, name: nav, widget: string }
      - label: SEO
        name: seo
        widget: object
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面描述, name: description, widget: text }
      - { label: 页面主标题, name: heading, widget: string }
      - { label: 标语（可选）, name: tagline, widget: string, required: false }
      - label: 产品（一个页面可放多个，每个产品独立图库+信息栏）
        name: products
        widget: list
