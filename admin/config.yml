# WOLFLAG 网站管理后台配置（Decap CMS）
# 部署到 GitHub + Cloudflare Pages 后需改两个地方：
#   1. repo:     改成你的 GitHub 仓库，如 "yourname/wolflag-site"
#   2. base_url: 改成 OAuth 代理地址，如 "https://decap-proxy.你的名字.workers.dev"
# 详细步骤见仓库根目录 README.md

backend:
  name: github
  repo: Tony0232-HZ/wolflag-site
  branch: main
  base_url: https://decap.tony222.workers.dev

media_folder: "media"                 # 上传图片保存位置（站内图片库）
public_folder: "/assets/media"        # 网站上图片 URL 前缀
logo_url: "/assets/media/favicon.png"
site_url: https://www.wolflag.com

collections:
  # ---------- 站点设置：导航 / 页脚 / 联系方式 ----------
  - name: settings
    label: 站点设置
    files:
      - name: site
        label: 导航 / 页脚 / 联系方式
        file: content/settings.json
        fields:
          - { label: 品牌名, name: brand, widget: string }
          - { label: Logo, name: logo, widget: image }
          - label: 导航菜单
            name: nav
            widget: list
            summary: "{{fields.label}} → {{fields.url}}"
            fields:
              - { label: 菜单文字, name: label, widget: string }
              - { label: 链接, name: url, widget: string }
              - { label: 外链(新窗口打开), name: external, widget: boolean, default: false }
              - label: 子菜单（可留空；添加后菜单项显示下拉列表）
                name: children
                widget: list
                required: false
                summary: "{{fields.label}} → {{fields.url}}"
                fields:
                  - { label: 子菜单文字, name: label, widget: string }
                  - { label: 链接, name: url, widget: string }
                  - { label: 外链(新窗口打开), name: external, widget: boolean, default: false }
          - label: 联系按钮
            name: contactButton
            widget: object
            fields:
              - { label: 按钮文字, name: text, widget: string }
              - { label: 按钮链接, name: url, widget: string }
          - label: 产品手册下载按钮
            name: catalogButton
            widget: object
            fields:
              - { label: 按钮文字, name: text, widget: string }
              - label: 产品手册文件 (PDF)
                name: file
                widget: file
                hint: 上传或更换产品手册 PDF 文件
          - { label: 博客页标题（列表页顶部）, name: blogTitle, widget: string, default: Blog, required: false, hint: 博客列表页顶部的大标题，默认 "Blog" }
          - label: 页脚
            name: footer
            widget: object
            fields:
              - label: 地址区块
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: 标题, name: heading, widget: string }
                  - label: 地址行
                    name: lines
                    widget: list
                    field: { label: 行, name: line, widget: string }
              - label: 电话
                name: phones
                widget: list
                field: { label: 电话, name: phone, widget: string }
              - label: 邮箱列表
                name: emails
                widget: list
                field: { label: 邮箱, name: email, widget: string }
              - { label: 页脚 Logo, name: logo, widget: image, required: false }
              - label: 社交图标
                name: icons
                widget: list
                summary: "{{fields.url}}"
                fields:
                  - { label: 图标图片, name: icon, widget: image }
                  - { label: 链接地址, name: url, widget: string, required: false, hint: 粘贴社交平台链接，如 https://www.facebook.com/xxx；留空则点击发邮件 }
              - { label: 版权行, name: copyright, widget: string }

  # ---------- 首页 ----------
  - name: home
    label: 首页
    files:
      - name: page
        label: 首页内容
        file: content/home.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - label: 首屏 (Hero)
            name: hero
            widget: object
            fields:
              - { label: 大标题, name: title, widget: string }
              - { label: 副文案, name: text, widget: text }
              - { label: 横幅图片（用于兼容/默认）, name: image, widget: image }
              - label: 轮播图片（可多张；第一张为默认，拖动手柄调顺序；只有 1 张时静止显示单图）
                name: images
                widget: list
                required: false
                summary: "{{fields.image}}"
                fields:
                  - { label: 图片, name: image, widget: image }
                  - { label: 图片说明(alt，可选), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名/标题） }
              - { label: 图片模式, name: mode, widget: select, options: [carousel, single], default: carousel, hint: carousel=多图轮播；single=只显示第一张（固定） }
              - { label: 轮播间隔（秒）, name: interval, widget: number, default: 5, value_type: "int", min: 1, hint: 自动换图间隔秒数，如填 5 }
              - label: 特性标签
                name: features
                widget: list
                field: { label: 标签, name: tag, widget: string }
          - label: 简介区块
            name: intro
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 文案, name: text, widget: text }
              - label: 照片
                name: images
                widget: list
                summary: "{{fields.image}}"
                fields:
                  - { label: 图片, name: image, widget: image }
                  - { label: 图片说明(alt，可选), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名/标题） }
          - label: 主要产品
            name: categories
            widget: object
            fields:
              - { label: 区块标题, name: title, widget: string }
              - { label: 导语, name: intro, widget: text }
              - label: 产品卡片
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: 卡片标题, name: title, widget: string }
                  - { label: 卡片文案, name: text, widget: text }
                  - { label: 图片, name: image, widget: image }
                  - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
                  - { label: 跳转链接, name: link, widget: string }
          - label: 补充模块（可添加多个；每个：图 + 标题 + 文字）
            name: supplement
            widget: list
            required: false
            summary: "{{fields.title || '补充模块'}}"
            fields:
              - { label: 显示此补充模块, name: show, widget: boolean, default: true, hint: 取消勾选即隐藏（内容会保留，重新勾选即可恢复） }
              - { label: 标题（可选）, name: title, widget: string, required: false }
              - { label: 文字（可用 **词** 加粗）, name: text, widget: text, required: false }
              - { label: 图片（可选）, name: image, widget: image, required: false }
              - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
          - label: "页面公告条（首页页面里的滚动公告条；显示/隐藏、颜色、内容、图标都在这里）"
            name: announce
            widget: object
            required: false
            fields:
              - { label: "显示此公告条", name: enabled, widget: boolean, default: true, required: false }
              - { label: "播放模式", name: mode, widget: select, options: [inout, slide], default: inout, required: false, hint: "inout=滚进→停→滚出→空档；slide=当前滚出时下一条同步滚进（重叠无缝）" }
              - { label: "背景色", name: bg, widget: color, default: "#faf7f5", required: false, hint: "默认米黄 #faf7f5；点开色块可换其它浅色" }
              - { label: "文字颜色", name: color, widget: color, default: "#272e47", required: false }
              - { label: "每条停留秒数（显示完整后停几秒再滚下一条）", name: pause, widget: number, default: 6, required: false, hint: "6 = 每条显示完整后停 6 秒再滚下一条；数字越大停越久（建议 3~8）" }
              - { label: "滚进/滚出时长（秒，越长滚动越慢）", name: scroll, widget: number, default: 7, required: false, hint: "7 = 从右侧滚进来、再滚出去各花 7 秒；数字越大滚动越慢（建议 4~8）" }
              - label: "公告内容（每条 = 一段文字 + 可选小图标；一次只滚一条，可加多条）"
                name: items
                widget: list
                required: false
                summary: "{{fields.text}}"
                fields:
                  - { label: "文字", name: text, widget: string }
                  - label: "小图标（可选，从常用图标里选）"
                    name: icon
                    widget: select
                    required: false
                    options:
                      - { label: "无", value: "" }
                      - { label: "🔊 喇叭(公告/通知)", value: "/assets/media/icon-megaphone.svg" }
                      - { label: "🏭 工厂(制造商)", value: "/assets/media/icon-factory.svg" }
                      - { label: "🌐 地球(全球)", value: "/assets/media/icon-globe.svg" }
                      - { label: "✉ 信封(邮箱/联系)", value: "/assets/media/icon-email.svg" }
                      - { label: "🤝 握手(合作/信任/成单)", value: "/assets/media/icon-handshake.svg" }
                      - { label: "❤️ 爱心(真诚/用心)", value: "/assets/media/icon-heart.svg" }
                      - { label: "🛡️ 盾勾(值得信赖/品质)", value: "/assets/media/icon-shield-check.svg" }
                      - { label: "⭐ 星星(品质/荣誉)", value: "/assets/media/icon-star.svg" }
                      - { label: "✔️ 圆圈勾(认证/靠谱)", value: "/assets/media/icon-check-circle.svg" }
                      - { label: "🏅 奖杯(荣誉/获奖)", value: "/assets/media/icon-award.svg" }
                      - { label: "🚚 卡车(快速发货/物流)", value: "/assets/media/icon-truck.svg" }
                      - { label: "🕐 时钟(及时/效率)", value: "/assets/media/icon-clock.svg" }
                      - { label: "📦 包裹(发货/包装)", value: "/assets/media/icon-package.svg" }
                      - { label: "💡 灯泡(创新/点子)", value: "/assets/media/icon-lightbulb.svg" }
                      - { label: "👍 点赞(认可/好评)", value: "/assets/media/icon-thumbs-up.svg" }

  # ---------- 关于我们 ----------
  - name: about
    label: 关于我们
    files:
      - name: page
        label: 关于我们内容
        file: content/about.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - label: 页头
            name: hero
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 副标题, name: subtitle, widget: string }
              - { label: 页头图片, name: image, widget: image }
              - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
          - label: "页面公告条（关于我们页顶部的那条滚动公告；显示/隐藏、颜色、内容、图标都在这里）"
            name: announce
            widget: object
            required: false
            fields:
              - { label: "显示此公告条", name: enabled, widget: boolean, default: true, required: false }
              - { label: "播放模式", name: mode, widget: select, options: [inout, slide], default: inout, required: false, hint: "inout=滚进→停→滚出→空档；slide=当前滚出时下一条同步滚进（重叠无缝）" }
              - { label: "背景色", name: bg, widget: color, default: "#faf7f5", required: false, hint: "默认米黄 #faf7f5；点开色块可换其它浅色" }
              - { label: "文字颜色", name: color, widget: color, default: "#272e47", required: false }
              - { label: "每条停留秒数（显示完整后停几秒再滚下一条）", name: pause, widget: number, default: 12, required: false, hint: "12 = 每条显示完整后停 12 秒再滚下一条；数字越大停越久（建议 3~8，示例页为 12）" }
              - { label: "滚进/滚出时长（秒，越长滚动越慢）", name: scroll, widget: number, default: 7, required: false, hint: "7 = 从右侧滚进来、再滚出去各花 7 秒；数字越大滚动越慢（建议 4~8）" }
              - label: "公告内容（每条 = 一段文字 + 可选小图标；一次只滚一条，可加多条）"
                name: items
                widget: list
                required: false
                summary: "{{fields.text}}"
                fields:
                  - { label: "文字", name: text, widget: string }
                  - label: "小图标（可选，从常用图标里选）"
                    name: icon
                    widget: select
                    required: false
                    options:
                      - { label: "无", value: "" }
                      - { label: "🔊 喇叭(公告/通知)", value: "/assets/media/icon-megaphone.svg" }
                      - { label: "🏭 工厂(制造商)", value: "/assets/media/icon-factory.svg" }
                      - { label: "🌐 地球(全球)", value: "/assets/media/icon-globe.svg" }
                      - { label: "✉ 信封(邮箱/联系)", value: "/assets/media/icon-email.svg" }
                      - { label: "🤝 握手(合作/信任/成单)", value: "/assets/media/icon-handshake.svg" }
                      - { label: "❤️ 爱心(真诚/用心)", value: "/assets/media/icon-heart.svg" }
                      - { label: "🛡️ 盾勾(值得信赖/品质)", value: "/assets/media/icon-shield-check.svg" }
                      - { label: "⭐ 星星(品质/荣誉)", value: "/assets/media/icon-star.svg" }
                      - { label: "✔️ 圆圈勾(认证/靠谱)", value: "/assets/media/icon-check-circle.svg" }
                      - { label: "🏅 奖杯(荣誉/获奖)", value: "/assets/media/icon-award.svg" }
                      - { label: "🚚 卡车(快速发货/物流)", value: "/assets/media/icon-truck.svg" }
                      - { label: "🕐 时钟(及时/效率)", value: "/assets/media/icon-clock.svg" }
                      - { label: "📦 包裹(发货/包装)", value: "/assets/media/icon-package.svg" }
                      - { label: "💡 灯泡(创新/点子)", value: "/assets/media/icon-lightbulb.svg" }
                      - { label: "👍 点赞(认可/好评)", value: "/assets/media/icon-thumbs-up.svg" }
          - label: 页面模块（可拖动手柄调整顺序，可 + 添加、删除；点每条左边的 ＞ 可展开看到内容）
            name: blocks
            widget: list
            types:
              - label: 文字段落
                name: text
                summary: "文字段落"
                fields:
                  - { label: 背景色, name: bg, widget: color, default: "#f8f8f8", hint: "点开选颜色（下方显示色块）。常用极简色：\n白 #ffffff\n米白 #fafaf9\n淡灰 #f8f8f8\n浅沙 #f5f0e8\n米黄 #faf7f5\n灰绿 #dfe3e2\n鼠尾草 #e8ece2\n雾蓝 #eef1f4\n藕粉 #f6f0ee\n浅炭 #f1f1ef" }
                  - { label: 文字（可用 **词** 加粗）, name: text, widget: text }
              - label: 图片
                name: image
                summary: "图片"
                fields:
                  - { label: 背景色, name: bg, widget: color, default: "#f8f8f8", hint: "点开选颜色（下方显示色块）。常用极简色：\n白 #ffffff\n米白 #fafaf9\n淡灰 #f8f8f8\n浅沙 #f5f0e8\n米黄 #faf7f5\n灰绿 #dfe3e2\n鼠尾草 #e8ece2\n雾蓝 #eef1f4\n藕粉 #f6f0ee\n浅炭 #f1f1ef" }
                  - { label: 图片, name: image, widget: image }
                  - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
              - label: 图文组合
                name: textImg
                summary: "图文组合"
                fields:
                  - { label: 背景色, name: bg, widget: color, default: "#f8f8f8", hint: "点开选颜色（下方显示色块）。常用极简色：\n白 #ffffff\n米白 #fafaf9\n淡灰 #f8f8f8\n浅沙 #f5f0e8\n米黄 #faf7f5\n灰绿 #dfe3e2\n鼠尾草 #e8ece2\n雾蓝 #eef1f4\n藕粉 #f6f0ee\n浅炭 #f1f1ef" }
                  - { label: 排版方向, name: direction, widget: select, options: [textLeft, textRight, textTop], default: textLeft, hint: textLeft=文左图右；textRight=文右图左；textTop=文上图下 }
                  - { label: 文字/图片比例, name: ratio, widget: select, options: ["50:50", "40:60", "60:40", "30:70"], default: "50:50", hint: 前面数字=文字占比，后面=图片占比 }
                  - label: 图片垂直位置（图片比文字矮时才有区别）
                    name: imgAlign
                    widget: select
                    required: false
                    default: top
                    options:
                      - { label: 顶部对齐（与文字首行齐平）, value: top }
                      - { label: 垂直居中（与文字中间对齐）, value: mid }
                      - { label: 底部对齐（与文字末行齐平）, value: bottom }
                    hint: "图片比左边文字矮的时候，决定图片靠上、居中还是靠下。「垂直居中」= 上下留白均分，视觉最平衡。只对「文左图右 / 文右图左」两栏排版有效，手机上不受影响。"
                  - { label: 标题（可选）, name: title, widget: string, required: false }
                  - { label: 文字（可用 **词** 加粗，多段用空行分隔）, name: text, widget: text, required: false }
                  - label: 固定图片（不轮播；每张可单独调上下位置，多张纵向堆叠）
                    name: images
                    widget: list
                    required: false
                    summary: "{{fields.image}}"
                    fields:
                      - { label: 图片, name: image, widget: image }
                      - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
                      - { label: 上下位置（像素，正数下移/负数上移，可选）, name: offset, widget: number, required: false, default: 0, hint: 例：填 60=这张图往下移 60px；填 -40=往上移 40px }
                  - label: 轮播图片（2026-09-10 新增；放在固定图片下方，可自动轮播展示多张图）
                    name: carousel
                    widget: object
                    required: false
                    fields:
                      - { label: 启用轮播, name: enabled, widget: boolean, default: true, hint: 勾上=轮播区显示；取消勾选=隐藏整个轮播区（内容保留） }
                      - { label: 轮播间隔（秒）, name: interval, widget: number, required: false, default: 5, value_type: "int", min: 1, hint: 自动换图间隔秒数，如填 5（参照首页轮播，默认 5 秒） }
                      - label: 轮播图片（可加多张；只有 1 张时不轮播，静止显示）
                        name: images
                        widget: list
                        required: false
                        summary: "{{fields.image}}"
                        fields:
                          - { label: 图片, name: image, widget: image }
                          - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
              - label: 客户区块
                name: clients
                summary: "客户区块 · {{fields.title}}"
                fields:
                  - { label: 背景色, name: bg, widget: color, default: "#ffffff", hint: "点开选颜色（下方显示色块）。常用极简色：\n白 #ffffff\n米白 #fafaf9\n淡灰 #f8f8f8\n浅沙 #f5f0e8\n米黄 #faf7f5\n灰绿 #dfe3e2\n鼠尾草 #e8ece2\n雾蓝 #eef1f4\n藕粉 #f6f0ee\n浅炭 #f1f1ef" }
                  - { label: 区块标题, name: title, widget: string }
                  - { label: 大标题, name: tagline, widget: string }
                  - { label: 副文案, name: subtitle, widget: string }
                  - { label: 客户 Logo, name: logos, widget: list, field: { label: Logo, name: logo, widget: image } }
              - label: FAQ 区块
                name: faq
                summary: "FAQ 区块"
                fields:
                  - { label: 背景色, name: bg, widget: color, default: "#dfe3e2", hint: "点开选颜色（下方显示色块）。常用极简色：\n白 #ffffff\n米白 #fafaf9\n淡灰 #f8f8f8\n浅沙 #f5f0e8\n米黄 #faf7f5\n灰绿 #dfe3e2\n鼠尾草 #e8ece2\n雾蓝 #eef1f4\n藕粉 #f6f0ee\n浅炭 #f1f1ef" }
                  - { label: 问题/答案, name: items, widget: list, summary: "{{fields.q}}", fields: [ { label: 问题, name: q, widget: string }, { label: 答案, name: a, widget: text } ] }
              - label: 时间轴（年份大事记）
                name: timeline
                summary: "时间轴 · {{fields.title}}"
                fields:
                  - { label: 背景色, name: bg, widget: color, default: "#f8f8f8", hint: "点开选颜色（下方显示色块）。常用极简色：\n白 #ffffff\n米白 #fafaf9\n淡灰 #f8f8f8\n浅沙 #f5f0e8\n米黄 #faf7f5\n灰绿 #dfe3e2\n鼠尾草 #e8ece2\n雾蓝 #eef1f4\n藕粉 #f6f0ee\n浅炭 #f1f1ef" }
                  - { label: 标题（可选，如 Our Journey）, name: title, widget: string, required: false }
                  - { label: 自动播放（开启=每隔几秒自动跳到下一年；关闭=手动）, name: autoPlay, widget: boolean, default: true, required: false }
                  - { label: 自动切换间隔（秒）, name: interval, widget: number, default: 5, required: false, hint: 填 5 = 每 5 秒跳一次；填 7 = 每 7 秒；建议 5~8 之间" }
                  - label: 里程碑（每一条 = 一个年份 + 当年大事；可拖顺序、增删）
                    name: items
                    widget: list
                    summary: "{{fields.year}}"
                    fields:
                      - { label: 年份, name: year, widget: string }
                      - { label: 当年的大事（英文，面向海外买家，可用 **词** 加粗）, name: text, widget: text }
              - label: 无缝滚动横幅（工厂车间实拍）
                name: marquee
                summary: "无缝滚动横幅"
                fields:
                  - { label: 背景色, name: bg, widget: color, default: "#ffffff", hint: "点开选颜色（下方显示色块）。常用极简色：\n白 #ffffff\n米白 #fafaf9\n淡灰 #f8f8f8\n浅沙 #f5f0e8\n米黄 #faf7f5\n灰绿 #dfe3e2\n鼠尾草 #e8ece2\n雾蓝 #eef1f4\n藕粉 #f6f0ee\n浅炭 #f1f1ef" }
                  - { label: 横幅图片（要超宽横图；会自动首尾相连循环滚动）, name: image, widget: image, hint: "建议用一张超宽的横长图（如 2700×260），里面横向拼好多个车间场景。网站会把这张图首尾相连、不停地往左滚动，看不出接缝。上传前请用英文小写连字符命名。" }
                  - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用兜底文案） }
                  - { label: 滚动一圈的秒数（数字越大滚得越慢）, name: duration, widget: number, default: 45, required: false, value_type: "int", min: 5, hint: "填 45 = 整条横幅滚动一整圈需要 45 秒。想更快填小一点（如 25）；想更慢填大一点（如 80）" }

  # ---------- 新增类目页（通用模板） ----------
  - name: pages
    label: 新增类目页
    folder: content/pages
    create: true
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.heading}}"
    identifier_field: slug
    fields:
      - { label: 文件标识（英文小写，如 stands-displays）, name: slug, widget: string, hint: 用于内容文件与网址命名 }
      - label: 页面声明
        name: page
        widget: object
        fields:
          - { label: 页面文件名（含 .html）, name: file, widget: string, hint: 如 stands-displays.html }
          - label: 排版模板
            name: layout
            widget: select
            options: [simple, flags, feather, bannerCards, pole, detail, flex]
            default: simple
            hint: simple=通用网格；flags=国旗式；feather=横卡式；bannerCards=横幅式；pole=旗杆展架式；detail=产品详情（多图+规格+价格表）；flex=通用图文（标题+文字+图片组合）。注：属性网格(specGrid)类页面请在「属性网格类目页」栏目里建
          - { label: 导航地址（无 .html 后缀），如 /stands-displays, name: nav, widget: string }
      - label: SEO
        name: seo
        widget: object
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面描述, name: description, widget: text }
      - { label: 页面主标题, name: heading, widget: string }
      - { label: 标语（可选）, name: tagline, widget: string, required: false }
      - { label: 顶部横幅图片, name: bannerImage, widget: image, required: false, hint: 页面顶部的大横幅（可选，不填则无横幅） }
      - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
      - label: 产品列表（通用/国旗/横幅/羽毛旗/旗杆等模板用）
        name: products
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { label: 名称, name: name, widget: string }
          - { label: 跳转链接（可选，填了图片和标题就可点击）, name: link, widget: string, required: false, hint: 如 /banner.html }
          - { label: 尺寸（可选）, name: size, widget: string, required: false }
          - { label: 材质（可选）, name: material, widget: string, required: false }
          - { label: 描述, name: desc, widget: text, required: false }
          - { label: 图片, name: image, widget: image }
          - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
      - label: 图文区块（flex 通用图文模板用，可按顺序多组）
        name: sections
        widget: list
        required: false
        summary: "{{fields.title || '图文区块'}}"
        fields:
          - { label: 显示此图文区块, name: show, widget: boolean, default: true, hint: 取消勾选即隐藏（内容会保留，重新勾选即可恢复） }
          - { label: 小标题, name: title, widget: string, required: false }
          - { label: 文字, name: text, widget: text, required: false }
          - label: 图片（可多张）
            name: images
            widget: list
            required: false
            field: { label: 图片, name: image, widget: image }

  # ---------- 属性网格类目页（specGrid）----------
  - name: specgrid
    label: 属性网格类目页（规格表）
    folder: content/specgrid
    create: true
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.heading}}"
    identifier_field: slug
    fields:
      - { label: 文件标识（英文小写，如 stands-displays）, name: slug, widget: string, hint: 用于网址命名 }
      - label: 页面声明
        name: page
        widget: object
        fields:
          - { label: 页面文件名（含 .html）, name: file, widget: string, hint: 如 stands-displays.html }
          - { label: 排版模板, name: layout, widget: select, options: [specGrid], default: specGrid }
          - { label: 导航地址，如 /stands-displays.html, name: nav, widget: string }
      - label: SEO
        name: seo
        widget: object
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面描述, name: description, widget: text }
      - { label: 页面主标题, name: heading, widget: string }
      - { label: 标语（可选）, name: tagline, widget: string, required: false }
      - { label: 顶部横幅图片, name: bannerImage, widget: image, required: false, hint: 页面顶部的大横幅（可选，不填则无横幅） }
      - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
      - label: 产品列表
        name: products
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { label: 品名, name: name, widget: string }
          - label: 产品属性（可自由新增/编辑/删除，显示为规格表）
            name: specs
            widget: list
            required: false
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: 属性名（如 Size/Material/颜色）, name: label, widget: string }
              - { label: 属性值（如 90*160cm、铝合金、红/蓝）, name: value, widget: string }
          - { label: 宣传语（品名下方那句话，可选；多行文本框可显示完整文字；可用 **词** 加粗）, name: subtitle, widget: text, required: false }
          - { label: 图片, name: image, widget: image }
          - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
      - label: 补充模块（可添加多个；每个：图 + 标题 + 文字）
        name: supplement
        widget: list
        required: false
        summary: "{{fields.title || '补充模块'}}"
        fields:
          - { label: 显示此补充模块, name: show, widget: boolean, default: true, hint: 取消勾选即隐藏（内容会保留，重新勾选即可恢复） }
          - { label: 标题（可选）, name: title, widget: string, required: false }
          - { label: 文字（可用 **词** 加粗）, name: text, widget: text, required: false }
          - { label: 图片（可选）, name: image, widget: image, required: false }
          - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }

