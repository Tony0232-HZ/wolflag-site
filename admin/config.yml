          - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名/标题） }
          - label: 产品属性（可自由新增/编辑/删除，如 Fabric、颜色、缝纫方式、特殊工艺、MOQ、交期 等）
            name: specs
            widget: list
            required: false
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: 属性名（如 Fabric / 颜色 / MOQ / Lead Time）, name: label, widget: string }
              - { label: 属性值（如 110g knitted polyester / 红 / 3 pieces）, name: value, widget: string }
