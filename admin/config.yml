            name: prices
            widget: list
            required: false
            summary: "{{fields.qty}} → {{fields.price}}"
            fields:
              - { label: 数量（如 100 pcs）, name: qty, widget: string }
              - { label: 价格（如 $0.85）, name: price, widget: string }
