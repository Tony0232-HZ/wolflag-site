        label: Pole & Display
        file: content/products/pole-display.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面描述, name: description, widget: text }
          - { label: 页面标题, name: heading, widget: string }
          - { label: 副标题, name: subheading, widget: string }
          - { label: 副标题说明, name: subtext, widget: text }
          - label: 主打产品 (大型卡)
            name: featured
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 描述, name: desc, widget: text }
              - { label: 补充说明, name: detail, widget: string }
              - { label: 强调标签, name: tag, widget: string }
              - { label: 图片, name: image, widget: image }
              - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }
          - label: 配件专栏
            name: ingredients
            widget: object
            fields:
              - { label: 专栏标题, name: title, widget: string }
              - { label: 副标题, name: subtitle, widget: string }
              - label: 配件
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: 描述, name: desc, widget: text }
                  - { label: 图片, name: image, widget: image }
                  - { label: 图片说明(alt), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名） }

  # ---------- 博客文章（新闻/产品/公告/公司大事） ----------
  - name: blog
    label: 博客文章
    folder: content/blog
    create: true
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.title}}"
    identifier_field: slug
    fields:
      - { label: 文件标识（英文小写，如 our-new-product）, name: slug, widget: string, hint: 用于网址命名，发布后不建议再改 }
      - { label: 文章标题, name: title, widget: string }
      - label: 发布日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        hint: 列表按日期排列（新的在前）
      - { label: 置顶（勾选后排在最前）, name: pinned, widget: boolean, default: false, required: false, hint: 勾选置顶后排在列表最前；多个置顶按时间排；取消勾选回到时间顺序 }
      - { label: 草稿（勾选则不上线）, name: draft, widget: boolean, default: false, required: false }
      - { label: 封面图片, name: coverImage, widget: image, required: false, hint: "★ 建议尺寸 1600×900（就是 16:9 的横图），文件 200KB 以内。\n\n为什么要 16:9：文章页会把原图按比例完整显示、不裁切；但列表页的小卡片高度固定，会居中裁成约 1.9:1 的横条。用 16:9 的图，电脑上只裁掉上下约 6%、手机上只裁掉左右约 4%，肉眼看不出来。\n\n⚠️ 别用太扁的图：比例超过 2:1（例如 1600×660）时，手机列表页会被裁掉约 30%，画面主体容易切没。\n⚠️ 上传前请确认图片四周没有白边或透明边。\n⚠️ 文件名请用英文小写连字符，如 custom-feather-flag-buying-guide.webp" }
      - { label: 封面图说明(alt，可选), name: imageAlt, widget: string, required: false, hint: 图片说明（alt，建议英文，含产品关键词；留空则自动用品名/标题） }
      - { label: 摘要（列表页显示）, name: summary, widget: text, required: false }
      - label: 正文内容
        name: blocks
        widget: list
        summary: "{{fields.type}}"
        fields:
          - { label: 类型, name: type, widget: select, options: [p, h2, image], default: p, hint: p=普通段落，h2=小标题，image=插图（任意位置、数量不限） }
          - { label: 文本（段落/小标题内容；图片类型时为描述文字）, name: text, widget: text, required: false }
          - { label: 图片（类型选 image 时上传）, name: image, widget: image, required: false }
          - { label: 图片说明(alt，可选), name: blockImageAlt, widget: string, required: false, hint: 填了就用它当图片 alt；留空则用上面的「文本」字段 }
